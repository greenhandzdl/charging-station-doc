#FEFFDD" d="M1356.8666,47.2719 L1356.8666,57.2719 L1366.8666,57.2719 L1356.8666,47.2719" style="stroke:#181818;stroke-width:.5"/><text x="1012.13" y="68.512" fill="#000" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacing" textLength="324.841">欠费状态由 charge_records.deduction_status 跟踪</text><text x="1012.13" y="88.784" fill="#000" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacing" textLength="339.737">充电桩仅维护 IDLE / CHARGING / FAULT 三种物理状态</text><text x="1012.13" y="109.056" fill="#000" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacing" textLength="317.421">欠费时用户 frozenUntil 被设置，阻止再次启动充电</text><text x="1012.13" y="129.328" fill="#000" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacing" textLength="181.999">用户充值补缴后自动解除冻结</text></g><g id="entity_GMN14" class="entity" data-entity="GMN14" data-source-line="23" data-uid="ent0015"><path fill="#FEFFDD" d="M111.23,220.3619 L111.23,261.9019 L76.85,265.9019 L111.23,269.9019 L111.23,311.4496 A0,0 0 0 0 111.23,311.4496 L505.7765,311.4496 A0,0 0 0 0 505.7765,311.4496 L505.7765,230.3619 L495.7765,220.3619 L111.23,220.3619 A0,0 0 0 0 111.23,220.3619" style="stroke:#181818;stroke-width:.5"/><path fill="#FEFFDD" d="M495.7765,220.3619 L495.7765,230.3619 L505.7765,230.3619 L495.7765,220.3619" style="stroke:#181818;stroke-width:.5"/><text x="117.23" y="241.602" fill="#000" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacing" textLength="373.546">报修流程: OPEN -&gt; IN_PROGRESS -&gt; RESOLVED -&gt; CLOSED</text><text x="117.23" y="261.874" fill="#000" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacing" textLength="270.997">充电桩在 CLOSED（审核通过）时恢复 IDLE</text><text x="117.23" y="282.146" fill="#000" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacing" textLength="282.855">RESOLVED（维修完成）时桩仍保持 FAULT，</text><text x="117.23" y="302.418" fill="#000" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacing" textLength="167.99