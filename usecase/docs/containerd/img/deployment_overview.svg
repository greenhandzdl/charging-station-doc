acing" textLength="199.849">- Mock 客户端应与生产网络隔离</text><text x="281.01" y="430.545" fill="#000" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacing" textLength="164.093">- 生产环境建议限制来源 IP</text></g><g id="entity_NGX" class="entity" data-entity="NGX" data-source-line="29" data-uid="ent0010"><rect width="136.516" height="50.272" x="824.74" y="267.54" fill="#F1F1F1" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:.5"/><rect width="15" height="10" x="941.256" y="272.54" fill="#F1F1F1" style="stroke:#181818;stroke-width:.5"/><rect width="4" height="2" x="939.256" y="274.54" fill="#F1F1F1" style="stroke:#181818;stroke-width:.5"/><rect width="4" height="2" x="939.256" y="278.54" fill="#F1F1F1" style="stroke:#181818;stroke-width:.5"/><text x="839.74" y="303.78" fill="#000" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacing" textLength="96.516">Nginx 反向代理</text></g><g id="entity_GMN11" class="entity" data-entity="GMN11" data-source-line="31" data-uid="ent0012"><path style="stroke:#181818;stroke-width:.5" fill="#FEFFDD" d="M1001.22,267.41 L1001.22,288.94 L961.5,292.94 L1001.22,296.94 L1001.22,317.9538 A0,0 0 0 0 1001.22,317.9538 L1192.7813,317.9538 A0,0 0 0 0 1192.7813,317.9538 L1192.7813,277.41 L1182.7813,267.41 L1001.22,267.41 A0,0 0 0 0 1001.22,267.41"/><path style="stroke:#181818;stroke-width:.5" fill="#FEFFDD" d="M1182.7813,267.41 L1182.7813,277.41 L1192.7813,277.41 L1182.7813,267.41"/><text x="1007.22" y="288.65" fill="#000" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacing" textLength="170.561">负责 SSL 终端、路由分发、</text><text x="1007.22" y="308.922" fill="#000" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacing" textLength="125.999">限流、静态资源服务</text></g><g id="entity_BE" class="entity" data-entity="BE" data-source-line="37" data-uid="ent0015"><rect width="117.322" height="50.272" x="1249.34" y="267.54" fill="#F1F1F1" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:.5"/><rect width="15" height="10" x="