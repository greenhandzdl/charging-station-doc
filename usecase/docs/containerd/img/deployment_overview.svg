.62,507.2119 L494.62,507.2119 L484.62,497.2119"/><text x="133.62" y="518.452" fill="#000" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacing" textLength="118.719">Mock充电机客户端</text><text x="133.62" y="538.724" fill="#000" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacing" textLength="100.408">Nginx 路由规则:</text><text x="139.892" y="558.996" fill="#000" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacing" textLength="340.577">location /api/v1/charges (prefix) → 转发至后端 (允许)</text><text x="139.892" y="579.268" fill="#000" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacing" textLength="306.193">location /api/v1/ (catch-all) → return 403 (拒绝)</text><text x="133.62" y="599.539" fill="#000" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacing" textLength="287.391">JWT scope = mock_charger_only 做二次校验</text><text x="133.62" y="619.811" fill="#000" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacing" textLength="196.041">双层安全隔离：网络层 + 认证层</text></g><g id="link_NGX_BE" class="link" data-entity-1="NGX" data-entity-2="BE" data-source-line="52" data-uid="lnk23"><path style="stroke:#181818;stroke-width:1" id="NGX-to-BE" fill="none" d="M915.75,318.09 C915.75,343.54 915.75,378.94 915.75,378.94 C915.75,378.94 1252.79,378.94 1252.79,378.94 C1252.79,378.94 1252.79,349.54 1252.79,324.09"/><polygon style="stroke:#181818;stroke-width:1" fill="#181818" points="1252.79 318.09 1248.79 327.09 1252.79 323.09 1256.79 327.09 1252.79 318.09"/><text x="863.876" y="396.18" fill="#000" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacing" textLength="56">反向代理</text><path style="stroke:#181818;stroke-width:.5" fill="#F0A" d="M704.27,406.2119 L704.27,436.2119 L1079.27,436.2119 L1079.27,416.2119 L1069.27,406.2119 L704.27,406.2119"/><path style="stroke:#181818;stroke-width:.5" fill="#F0A" d="M1069.27,406.2119 L1069.27,416.2119 L1079.27,416.2119 L1069.27,406.2119"/><text x="710.27" y="427.452" fi